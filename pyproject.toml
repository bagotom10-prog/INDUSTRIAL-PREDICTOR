[project]
name = "inspector-industrial"
version = "0.1.0"
description = "A program in my computer that look at images of industrial pieces and detects weather they are de potential defects or not, consult a manual to verify, and generate an automated technical report."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.2.0",
    "kagglehub>=1.0.3",
    "pillow>=13.0.0",
    "pyyaml>=6.0.4",
    "ultralytics>=8.4.218",
]

[project.scripts]
inspector-industrial = "inspector_industrial:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
