[project]
name = "inspector-industrial"
version = "0.1.0"
description = "Inspección visual de piezas de acero: detección de defectos con YOLO, criterios de aceptación, diagnóstico apoyado en el manual de calidad (RAG + LLM) y API web."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.14.0",
    "datasets>=5.2.0",
    "fastapi>=0.165.0",
    "kagglehub>=1.0.3",
    "pillow>=13.0.0",
    "pypdf>=7.1.1",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.4",
    "ultralytics>=8.4.218",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
inspector-industrial = "inspector_industrial:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "reportlab>=5.1.1",
]
